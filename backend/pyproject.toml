[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroorbitx-backend"
version = "0.1.0"
description = "AstroOrbitX student prototype backend foundation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.40",
    "uvicorn==0.34.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = ["migrations", "migrations.*", "tests", "tests.*"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
