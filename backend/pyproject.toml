[project]
name = "astroorbitx-backend"
version = "0.1.0"
description = "AstroOrbitX student prototype backend foundation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "alembic==1.15.2",
    "fastapi==0.115.12",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "uvicorn==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = false
